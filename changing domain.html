<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Remplacer domaine JSON (URL)</title>

<style>
body{
    font-family: Arial;
    padding:30px;
    max-width:800px;
    margin:auto;
}

input, button, textarea{
    width:100%;
    padding:10px;
    margin-top:10px;
}

textarea{
    height:300px;
}
</style>

</head>
<body>

<h2>Modifier les liens JSON depuis une URL</h2>

<input id="jsonUrl" type="text" placeholder="URL du JSON">
<input id="domainInput" type="text" placeholder="https://nouveaudomaine.com">

<button onclick="process()">Charger et transformer</button>

<textarea id="output" placeholder="Résultat..."></textarea>

<script>
async function process(){
    const jsonUrl = document.getElementById("jsonUrl").value.trim();
    const domainInput = document.getElementById("domainInput").value.trim();
    const output = document.getElementById("output");

    if(!jsonUrl || !domainInput){
        alert("Remplis les deux champs !");
        return;
    }

    try{
        const res = await fetch(jsonUrl);
        const data = await res.json();

        const newDomain = new URL(domainInput);

        const updated = data.map(item => {
            if(!item.link) return item;

            try{
                const url = new URL(item.link);

                url.protocol = newDomain.protocol;
                url.host = newDomain.host;

                return {
                    ...item,
                    link: url.toString()
                };

            }catch{
                return item;
            }
        });

        output.value = JSON.stringify(updated, null, 2);

    }catch(err){
        alert("Erreur lors du chargement du JSON");
        console.error(err);
    }
}
</script>

</body>
</html>
