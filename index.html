<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Parser Links</title>
</head>

<body>

  <h2>Parser de liens automatique</h2>
  <p>Ouvre la console navigateur pour voir les résultats (F12)</p>
  <input type="text" id="urlInput" placeholder="Url">
  <input type="text" id="selectorInput" placeholder="Class/Id">
  <button onclick="parseLinks()">Launch parsing</button>
  <script>

    async function parseLinks() {

      try {

        const url = document.getElementById("urlInput").value;
        const selector = document.getElementById("selectorInput").value;

        const response = await fetch(url, {
          headers: {
            "User-Agent": "Parser analyse structure site apprentissage parsing"
          }
        });

        const html = await response.text();

        const parser = new DOMParser();
        const doc = parser.parseFromString(html, "text/html");

        const results = [];

        let elements;

        // Sélection selon class ou id
        if (selector.startsWith("#")) {
          const id = selector.slice(1);
          elements = doc.querySelectorAll(`#${id} a`);
        }

        else if (selector.startsWith(".")) {
          const cls = selector.slice(1);
          elements = doc.querySelectorAll(`.${cls} a`);
        }

        else {
          // fallback = tous les a correspondant au selector
          elements = doc.querySelectorAll(selector);
        }

        // Association texte + lien
        elements.forEach(a => {

          if (a.href) {
            results.push({
              text: a.textContent.trim(),
              link: a.href
            });
          }

        });

        localStorage.setItem("parsedLinks", JSON.stringify(results));

        console.log("Résultats :", results);

      } catch (err) {
        console.error("Erreur parsing :", err);
      }



    }

  </script>
</body>

</html>
